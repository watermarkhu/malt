# Arity table for common MATLAB built-in functions used by the GTARG / LTARG
# checks. Each entry declares the minimum and maximum number of arguments a
# call to the function is expected to take.
#
# Rules of thumb:
#   - Fixed-arity functions (e.g. sin) have min_args = max_args.
#   - Functions with optional arguments (e.g. round, sort) widen the range.
#   - Variadic functions (fprintf, sprintf, char, reshape) use a large max.
#   - Functions that accept zero arguments (rand, randn) have min_args = 0.
#
# The checks only fire on calls whose argument count falls outside the range;
# calls to functions not listed here (or not defined in the same file) are
# skipped entirely.

[[functions]]
name = "sin"
min_args = 1
max_args = 1

