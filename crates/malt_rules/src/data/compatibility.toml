# Compatibility checks. Fields beyond the Rust struct's own docs (see compatibility/mod.rs):
#   handle         - true: MATLAB reports the `@name` handle form (554 entries, probed one
#                    `h = @name;` each). False (default): silent on `@name`.
#   number_arg_at  - N: argument N must be a number literal (QAMDEPM: `qammod(x, 4, 0)`
#                    reports, `qammod(x, 4, pi/4)` does not).
#   pairs_from     - N: from argument N on the arguments are name-value pairs (an even
#                    count); `args_any` names one of those names (BUFSIZE).
#   renames_to     - the message names a direct replacement; the fix renames the callee,
#                    the command or the handle to this name and keeps the arguments.
#   function_prefix - matches every member of the package `function_name` (JAPIMATHWORKS:
#                    `com.mathworks.util.X`, not `com.mathworks`).
#   low_reliability - true: off by default (on with the behavior-changes category or the
#                    experimental flag). MATLAB's own list marks 897 entries so; the
#                    generic checks MATLAB stayed silent on in every probed shape (NOV6,
#                    REPUDD, LSRET, READSZK, READSZR, SMPLMODE, GETERR, SETERR,
#                    COEFF1 to COEFFC3; docs/VERIFY.md 'Recording the stable checks') carry
#                    it too, so malt does not report what it cannot show MATLAB reporting.
#   Entries whose MATLAB severity is "Error" in the reference list are `severity = "error"`.

[[checks]]
id = "DPSD"
function_name = "psd"
severity = "error"
message = "'psd' has been removed. Use 'periodogram' or 'pwelch' instead."
category = "compatibility"

