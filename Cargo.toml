[workspace]
resolver = "2"
members = [
    "crates/malt_cli",
    "crates/malt_core",
    "crates/malt_index",
    "crates/malt_py",
    "crates/malt_rules",
    "crates/malt_wasm",
]

[workspace.package]
# Placeholder: the release workflow stamps the semantic version here (and in the
# internal dependencies below) right before building and publishing.
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Mark Shui Hu"]
repository = "https://github.com/watermarkhu/malt"
homepage = "https://watermarkhu.nl/malt"
keywords = ["matlab", "linter", "lint", "static-analysis", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Internal crates, published to crates.io as `malt-core`, `malt-rules` and
# `malt-cli` (the bare `malt` crate name belongs to an unrelated project).
malt-core = { path = "crates/malt_core", version = "0.0.0" }
malt-rules = { path = "crates/malt_rules", version = "0.0.0" }
# The native MATLAB path index (no crates.io release: `publish = false`).
malt-index = { path = "crates/malt_index" }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-matlab = { git = "https://github.com/watermarkhu/tree-sitter-matlab", rev = "d377bdf40f7256c388893160d5087285c497b598" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inventory = "0.3"
regex = "1"
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[profile.release]
# Thin LTO: 5-9% faster linting on large files for about a second more build
# time. Fat LTO with one codegen unit measured no faster and builds 2.5x slower.
# `panic = "abort"` is not an option: the linter catches a panicking rule and
# reports QUIT instead.
lto = "thin"
