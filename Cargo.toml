[workspace]
resolver = "2"
members = [
    "crates/mlt_cli",
    "crates/mlt_core",
    "crates/mlt_rules",
    "crates/mlt_wasm",
]

[workspace.package]
# Placeholder: the release workflow stamps the semantic version here (and in the
# internal dependencies below) right before building and publishing.
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Mark Shui Hu"]
repository = "https://github.com/watermarkhu/mlt"
homepage = "https://watermarkhu.nl/mlt"
keywords = ["matlab", "linter", "lint", "static-analysis", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Internal crates. On crates.io they are published as `mlt-lint-*` (the `mlt*`
# names belong to MapLibre Tiles); the library names stay `mlt_core`/`mlt_rules`.
mlt_core = { package = "mlt-lint-core", path = "crates/mlt_core", version = "0.0.0" }
mlt_rules = { package = "mlt-lint-rules", path = "crates/mlt_rules", version = "0.0.0" }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-matlab = "1.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inventory = "0.3"
regex = "1"
