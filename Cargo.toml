[workspace]
resolver = "2"
members = [
    "crates/malt_cli",
    "crates/malt_core",
    "crates/malt_rules",
    "crates/malt_wasm",
]

[workspace.package]
# Placeholder: the release workflow stamps the semantic version here (and in the
# internal dependencies below) right before building and publishing.
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Mark Shui Hu"]
repository = "https://github.com/watermarkhu/malt"
homepage = "https://watermarkhu.nl/malt"
keywords = ["matlab", "linter", "lint", "static-analysis", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Internal crates, published to crates.io as `malt-core`, `malt-rules` and
# `malt-cli` (the bare `malt` crate name belongs to an unrelated project).
malt-core = { path = "crates/malt_core", version = "0.1.1" }
malt-rules = { path = "crates/malt_rules", version = "0.1.1" }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-matlab = "1.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
inventory = "0.3"
regex = "1"
