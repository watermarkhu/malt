name: Docs

# Builds the VitePress site; deploys it to GitHub Pages when `push` is true.
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to check out and build the docs from
        type: string
        default: ""
      push:
        description: Deploy the built site to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated docs are current
        run: bun docs/scripts/gen_rules_docs.ts --check

      - name: Build VitePress site
        run: bun run docs:build

      - name: Configure Pages
        if: inputs.push
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        if: inputs.push
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    # No `environment: github-pages`: releases run on pull_request events
    # (ref refs/pull/N/merge), which its default branch policy would reject.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
