name: Release

# Same strategy as mkdocstrings-matlab: semVersie derives the next version from
# the Conventional Commit title of a pull request into main (and labels the PR
# with the bump). When that pull request is merged, the version is stamped into
# the Cargo workspace (the single source of truth for the crates, the Python
# wheels and the npm package), tagged, and published to crates.io, PyPI and npm.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - closed
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ !github.event.pull_request.merged }}

permissions:
  contents: read

jobs:
  version:
    name: Semantic version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required for adding the labels to the PR
      issues: write # Required for adding labels to the repository
    outputs:
      release: ${{ steps.get-version.outputs.release }}
      tag: ${{ steps.get-version.outputs.tag }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get semantic version
        uses: RonaldPhilipsen/semVersie@41233349edfb40f4e6da4251fea7684026182dc9 # v2.3.4
        id: get-version
        with:
          add-pr-label: true
          label-prefix: false

  build:
    name: Build distributions
    needs: version
    if: needs.version.outputs.release == 'true' && github.event.pull_request.merged
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Tag and publish
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # crates.io + PyPI trusted publishing, npm provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set credentials for git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Stamp version
        run: |
          sed -i "s/\"0\.0\.0\"/\"${VERSION}\"/g" Cargo.toml
          cargo update --workspace
          git add Cargo.toml Cargo.lock

      # The bump commit is only reachable through the tag; main keeps 0.0.0.
      - name: Create commit and tag
        run: |
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push -f origin "${TAG}"

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: wasm-pkg/pkg

      # --- crates.io --------------------------------------------------------
      # Trusted publishing (OIDC) once it is configured for the crates; the
      # CARGO_REGISTRY_TOKEN secret covers the very first publish.
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
        continue-on-error: true

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in mlt-lint-core mlt-lint-rules mlt-lint; do
            if curl -sfA "mlt-release (github.com/watermarkhu/mlt)" \
                "https://crates.io/api/v1/crates/${crate}/${VERSION}" > /dev/null; then
              echo "⏭️ ${crate} ${VERSION} already published, skipping"
            else
              cargo publish --locked -p "${crate}"
            fi
          done

      # --- PyPI -------------------------------------------------------------
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

      # --- npm ----------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Pinned, not @latest: npm 12.0.0 ships a provenance path that fails with
      # "Cannot find module 'sigstore'", so `npm publish --provenance` aborts.
      # 11.18.0 is the last 11.x and supports the OIDC publishing this needs.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.18.0

      - name: Publish WASM to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd wasm-pkg/pkg
          if ! output=$(npm publish --provenance --access public 2>&1); then
            if echo "$output" | grep -q "previously published"; then
              echo "⏭️ mlt-wasm ${VERSION} already published, skipping"
            else
              echo "$output"
              exit 1
            fi
          fi
          npm pack --pack-destination ../../dist

      # --- GitHub release ---------------------------------------------------
      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          gh release create "${TAG}"
          dist/*
          --title "${TAG}"
          --generate-notes
          --verify-tag

  docs:
    name: Deploy documentation
    needs: [version, publish]
    # Deploy on every merge; from the new tag when a release was cut.
    if: >-
      !cancelled() && github.event.pull_request.merged &&
      needs.publish.result != 'failure'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.tag || 'main' }}
      push: true
